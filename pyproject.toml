[tool.pytest.ini_options]
# Add the repo root to sys.path so imports work in tests without an editable install.
pythonpath = ["."]
# Where pytest looks for tests by default (so `pytest` from repo root works).
testpaths = ["agent/tests"]
# Default options: lean output (quiet, no header, no warnings summary, only
# failures/errors in the short summary), short tracebacks, and the 10 slowest
# tests at the end.
addopts = "-q --no-header --disable-warnings -rfE --tb=short --durations=10"

[tool.ruff]
# The code is written to ~120 columns; ruff's default of 88 would rewrap most of it.
line-length = 120
# Python only: ruff also formats the code blocks in Markdown, and the plans and
# specs under docs/ are records, not code to keep tidy.
extend-exclude = ["*.md"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in the signature.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Header", "fastapi.Body"]
